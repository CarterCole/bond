# Push a tag like v0.2.0 to publish a release: an archive for every platform
# and a .deb for every Linux one on the GitHub release, the Homebrew formula in
# the tap, and a rebuild of apt.cartercole.net, so that
#
#   brew install cartercole/tap/bond
#   sudo apt install bond
#
# install it. Homebrew and apt download without credentials, so the release
# has to be on a public repository.
#
# Needs two repository secrets, each the private half of an SSH deploy key
# with write access to one repository and nothing else:
#   HOMEBREW_TAP_DEPLOY_KEY  CarterCole/homebrew-tap
#   APT_REPO_DEPLOY_KEY      CarterCole/apt
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test -short ./...

      - name: Build
        run: make release VERSION="$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/release/*.tar.gz dist/release/*.deb dist/release/checksums.txt

      - name: Update the Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAP: CarterCole/homebrew-tap
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:$TAP.git" tap
          mkdir -p tap/Formula
          cp dist/release/bond.rb tap/Formula/bond.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bond.rb
          git commit -m "bond ${GITHUB_REF_NAME#v}"
          git push

      # The apt repository's own build downloads the .debs from this release
      # (and the two before it); the push is what starts it.
      - name: Update the apt repository
        env:
          DEPLOY_KEY: ${{ secrets.APT_REPO_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          APT_REPO: CarterCole/apt
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/apt_key
          chmod 600 ~/.ssh/apt_key
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/apt_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:$APT_REPO.git" apt
          echo "$GITHUB_REPOSITORY $GITHUB_REF_NAME" > apt/projects/bond
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/bond
          git commit -m "bond ${GITHUB_REF_NAME#v}"
          # Another project's release may have pushed in the meantime.
          for try in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
