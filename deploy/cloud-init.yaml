#cloud-config
# Prepares a fresh Linux VM (AWS, Google Cloud, Azure, Hetzner, …) to be a bond
# aggregator. Paste it as "user data" when creating the machine, then put the
# daemon on it from your checkout:
#
#     deploy/push.sh user@<the machine's address>
#
# Open UDP and TCP port 7777 in the provider's firewall.

package_update: true
packages:
  - iptables

write_files:
  # Routing other machines' packets is the job.
  - path: /etc/sysctl.d/60-bond.conf
    content: |
      net.ipv4.ip_forward = 1
      # Bigger socket buffers: bursts at a few hundred Mbit/s overflow the defaults.
      net.core.rmem_max = 8388608
      net.core.wmem_max = 8388608

runcmd:
  - sysctl --system
