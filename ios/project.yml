# Bond for iOS. The Xcode project is generated from this file:
#
#   xcodegen generate        (or `make ios` from the repository root)
#
# Signing for device builds is set in Config/Local.xcconfig; see README.md.

name: Bond

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Bond.xcconfig
  Release: Config/Bond.xcconfig

settings:
  base:
    # Swift 6 language mode: data-race safety is checked, not assumed.
    SWIFT_VERSION: "6.0"
    # Async functions stay on their caller's actor unless they say otherwise,
    # which is what lets the provider's async overrides take NetworkExtension's
    # non-Sendable arguments.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Bond:
    type: application
    platform: iOS
    sources:
      - path: Bond
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOND_ID_PREFIX).bond
        TARGETED_DEVICE_FAMILY: "1"
        # The Go framework is module "Bond"; the app cannot be one too.
        PRODUCT_MODULE_NAME: BondApp
        INFOPLIST_FILE: Bond/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bond/Bond.entitlements
    dependencies:
      - target: BondTunnel
      # gomobile builds a static-library framework: link it, never embed it.
      - framework: Frameworks/Bond.xcframework
        embed: false
    scheme: {}

  BondTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: BondTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOND_ID_PREFIX).bond.tunnel
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BondTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: BondTunnel/BondTunnel.entitlements
    dependencies:
      - framework: Frameworks/Bond.xcframework
        embed: false
